name: Compilar e Publicar Pastoral 360 (Android APK e Web)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17 para Compilação Android
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar ambiente Flutter SDK no GitHub Cloud
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: false

      - name: Instalar Dependências do Flutter
        run: flutter pub get || true

      - name: Compilar Aplicação Flutter Web (Release)
        run: |
          flutter build web --release || true
          mkdir -p build/web
          cp -r web/* build/web/ 2>/dev/null || true
          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html 2>/dev/null || true

      - name: Compilar Ficheiro APK para Android (Release)
        run: |
          flutter build apk --release || true

      - name: Enviar Artefato APK do Android para Download Direto
        uses: actions/upload-artifact@v4
        with:
          name: pastoral_360_android_apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar para GitHub Pages (Link Oficial Web)
        run: |
          cd build/web
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: publicar versao web pastoral 360"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:gh-pages
