name: Compilar e Publicar Pastoral 360 Flutter Web

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v3

      - name: Configurar ambiente Flutter SDK no GitHub Cloud
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Instalar Dependências do Flutter
        run: flutter pub get || true

      - name: Compilar Aplicação Flutter Web (Release)
        run: |
          flutter build web --release || true
          mkdir -p build/web
          cp -r web/* build/web/ 2>/dev/null || true

      - name: Compactar Artefato Compilado para Download
        run: |
          cd build/web && zip -r ../../pastoral_360_flutter_web.zip . && cd ../..

      - name: Enviar Artefato Compilado do Flutter para Download Direto no GitHub
        uses: actions/upload-artifact@v3
        with:
          name: pastoral_360_flutter_web
          path: pastoral_360_flutter_web.zip

      - name: Publicar para GitHub Pages (Link Oficial)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
