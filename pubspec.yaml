name: pastoral_360
description: "Sistema Integral de Avaliação Pastoral e Gestão Ministerial (MCASD 2026)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.5.1
  
  # Navigation
  go_router: ^14.2.0
  
  # Authentication & Cloud
  supabase_flutter: ^2.5.0
  
  # UI / Material 3
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.0
  
  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
